<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>PanelCast</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Panel<span>Cast</span></div>
  </header>

  <h1>Send something to the display</h1>
  <p class="lead">Enter the code shown on the display, then choose what to share.</p>

  <div class="card">
    <label class="field">
      <span class="lbl">Code on the display</span>
      <input type="text" id="roomInput" inputmode="latin" autocapitalize="characters"
             autocomplete="off" spellcheck="false" maxlength="6" placeholder="ABC123">
    </label>
    <div class="row">
      <button id="goPhone">Phone camera</button>
      <button class="secondary" id="goPc">Computer screen</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <p class="hint">
    <b>Phone camera</b> turns this device into a live viewer or document camera.<br>
    <b>Computer screen</b> shares a window, tab, or your whole desktop.
  </p>

  <footer class="foot">Nothing is recorded. Video goes straight to the display.</footer>
</div>

<script>
var input = document.getElementById('roomInput');
var status = document.getElementById('status');

input.addEventListener('input', function (e) {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

function go(prefix) {
  var code = input.value.trim().toUpperCase();
  if (code.length < 4) {
    status.textContent = 'Enter the code from the display.';
    status.className = 'status err';
    return;
  }
  // Relative to the current directory so this works under /panelcast too.
  var base = location.pathname.replace(/\/[^/]*$/, '');
  location.href = base + '/' + prefix + '/' + code;
}
document.getElementById('goPhone').onclick = function () { go('j'); };
document.getElementById('goPc').onclick = function () { go('pc'); };

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') go('j');
});
</script>
</body>
</html>
