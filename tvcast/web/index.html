<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>PanelCast</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Panel<span>Cast</span></div>
  </header>

  <h1>Send something to the display</h1>
  <p class="lead">Enter the code shown on the display. You'll choose what to share next.</p>

  <div class="card">
    <label class="field">
      <span class="lbl">Code on the display</span>
      <input type="text" id="roomInput" inputmode="latin" autocapitalize="characters"
             autocomplete="off" spellcheck="false" maxlength="6" placeholder="ABC123">
    </label>
    <button id="goShare">Continue</button>
    <div class="status" id="status"></div>
  </div>

  <p class="hint">
    You can send this phone's camera (as a live view or document camera), or
    share a window or screen from a computer.
  </p>

  <footer class="foot">Nothing is recorded. Video goes straight to the display.</footer>
</div>

<script>
var input = document.getElementById('roomInput');
var status = document.getElementById('status');

input.addEventListener('input', function (e) {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

function go() {
  var code = input.value.trim().toUpperCase();
  if (code.length < 4) {
    status.textContent = 'Enter the code from the display.';
    status.className = 'status err';
    return;
  }
  // Use the server-supplied base path; inferring it from location.pathname is
  // ambiguous for /panelcast vs /panelcast/ (see sender.js).
  var base = (window.PANELCAST_BASE !== undefined)
    ? window.PANELCAST_BASE
    : location.pathname.replace(/\/+$/, '');
  location.href = base + '/s/' + code;
}

document.getElementById('goShare').onclick = go;
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') go();
});
</script>
</body>
</html>
